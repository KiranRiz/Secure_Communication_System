<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — SecureChat</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="logo">🔐 SecureChat</div>
        <p class="tagline">Reset your password</p>

        <input type="password" id="new-password" placeholder="New password" class="input-field">
        <input type="password" id="confirm-password" placeholder="Confirm password" class="input-field">
        <button class="btn-primary" onclick="handleReset()">Reset Password</button>
        <div id="message" class="message"></div>
        <p style="margin-top:16px;text-align:center">
            <a href="/" style="color:#4fd1c5">Back to login</a>
        </p>
    </div>

    <script>
        const TOKEN = {{ token|tojson }};

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type;
        }

        async function handleReset() {
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            if (!TOKEN) {
                showMessage('Missing reset token', 'error');
                return;
            }
            if (!password || password !== confirm) {
                showMessage('Passwords must match', 'error');
                return;
            }
            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: TOKEN, password })
                });
                const data = await res.json();
                showMessage(data.message || 'Done', data.success ? 'success' : 'error');
                if (data.success) {
                    setTimeout(() => window.location.href = '/', 1000);
                }
            } catch (e) {
                showMessage('Server not reachable', 'error');
            }
        }
    </script>
</body>
</html>
