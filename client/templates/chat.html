<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial
scale=1.0"> 
    <title>SecureChat</title> 
    <link rel="stylesheet" href="/static/style.css"> 
    <script 
src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.
min.js"></script> 
</head> 
<body> 
    <div class="chat-container"> 
 
        <!-- Header --> 
        <div class="chat-header"> 
            <span>🔐 SecureChat</span> 
            <span class="username-badge">👤 {{ username }}</span> 
            <span id="status-dot" class="status-dot">🔴 
Connecting...</span> 
        </div> 
 
        <!-- Key Exchange Panel --> 
        <div class="key-panel" id="key-panel"> 
            <h3>🔑 Key Exchange Required</h3> 
            <p>Enter recipient username to establish encrypted 
session:</p> 
            <div class="key-input-row"> 
                <input type="text" id="recipient-input" 
                       placeholder="Recipient username" 
                       class="input-field small"> 
                <button class="btn-primary small" 
                        onclick="startKeyExchange()"> 
                    Connect 
                </button> 
            </div> 
            <div id="fingerprint-display" class="fingerprint-box" 
                 style="display:none"> 
            </div> 
        </div> 
 
        <!-- Messages Area --> 
        <div class="messages-area" id="messages-area"> 
            <div class="system-msg"> 
                🔐 Messages are end-to-end encrypted. 
                Server cannot read your messages. 
            </div> 
        </div> 
 
        <!-- Input Area --> 
        <div class="input-area"> 
            <input type="text" id="message-input" 
                   placeholder="Type encrypted message..." 
                   class="input-field" disabled 
                   onkeypress="if(event.key==='Enter') sendMessage()"> 
            <button class="btn-send" id="send-btn" 
                    onclick="sendMessage()" disabled> 
                Send 🔒 
            </button> 
        </div> 
 
    </div> 
 
    <script src="/static/chat.js"></script> 
    <script> 
        // Pass Flask variables to JavaScript 
        const CURRENT_USER = "{{ username }}"; 
        const SERVER_URL = "{{ server_url }}"; 
    </script> 
</body> 
</html>
